<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stock Live Monitor</title>

<style>
  :root {
    --bg: #fff1e6;
    --card: #0f172a;
    --primary: #6d5dfc;
    --green: #22c55e;
    --red: #ef4444;
    --text: #e5e7eb;
  }

  body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: var(--bg);
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
    color: #111;
  }

  .card {
    background: var(--card);
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  }

  /* 🔑 KEY FIX */
  .table-container {
    overflow-x: auto;
    width: 100%;
  }

  table {
    width: 100%;
    min-width: 1100px; /* ensures columns don't collapse */
    border-collapse: collapse;
    color: var(--text);
  }

  th, td {
    padding: 10px 12px;
    text-align: center;
    border-bottom: 1px solid #334155;
    white-space: nowrap;
  }

  th {
    background: #020617;
    font-size: 14px;
    position: sticky;
    top: 0;
    z-index: 1;
  }

  tr:hover {
    background: rgba(255,255,255,0.05);
  }

  .green {
    color: var(--green);
    font-weight: bold;
  }

  .red {
    color: var(--red);
    font-weight: bold;
  }

  .loading {
    text-align: center;
    padding: 20px;
    color: #333;
  }
</style>
</head>

<body>

<h1>📈 Stock Live Monitor</h1>

<div class="card">
  <div class="table-container">
    <table id="stockTable">
      <thead>
        <tr>
          <th>Symbol</th>
          <th>Price</th>
          <th>Change</th>
          <th>%</th>
          <th>10:30 High</th>
          <th>10:30 Low</th>
          <th>Current High</th>
          <th>Current Low</th>
          <th>Updated</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="9" class="loading">Loading data...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const API_URL = "https://YOUR_BACKEND_URL/api/stocks"; // change if needed

async function loadStocks() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();

    const tbody = document.querySelector("#stockTable tbody");
    tbody.innerHTML = "";

    data.forEach(stock => {
      const row = document.createElement("tr");

      const changeClass = stock.change >= 0 ? "green" : "red";

      row.innerHTML = `
        <td>${stock.symbol}</td>
        <td>${stock.current_price ?? "-"}</td>
        <td>-</td>
        <td>-</td>
        <td>${stock.high_1030 ?? "-"}</td>
        <td>${stock.low_1030 ?? "-"}</td>
        <td>${stock.current_high ?? "-"}</td>
        <td>${stock.current_low ?? "-"}</td>
        <td>${stock.last_updated ?? "-"}</td>
      `;

      tbody.appendChild(row);
    });

  } catch (err) {
    console.error(err);
    document.querySelector("#stockTable tbody").innerHTML =
      `<tr><td colspan="9" class="loading">Failed to load data</td></tr>`;
  }
}

loadStocks();
setInterval(loadStocks, 30000);
</script>

</body>
</html>
