<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stock Live Monitor</title>

<style>
  :root {
    --bg: #fff1e6;
    --card: #0f172a;
    --green: #22c55e;
    --red: #ef4444;
    --amber: #f59e0b;
    --pink: #ec4899;
    --text: #e5e7eb;
  }

  body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: var(--bg);
  }
  .add-stock-container {
    justify-content: center;   /* center horizontally */
    align-items: center;
    gap: 10px;                 /* space between input & button */
    margin: 20px auto;
  }
  
  .add-stock-container input {
    text-align : center
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid #ddd;
    font-size: 14px;
    width: 160px;
  }
  
  .add-btn {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    background-color: #6c63ff; /* purple like your screenshot */
    color: white;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  
  .add-btn:hover {
    background-color: #5a52d6;
  }


  h1 {
    text-align: center;
    margin-bottom: 15px;
  }

  .card {
    padding: 16px;
    border-radius: 12px;
  }

  .controls {
    gap: 10px;
    margin-bottom: 12px;
  }

  input {
    flex: 1;
    padding: 8px;
    border-radius: 6px;
    border: none;
  }

  button {
    padding: 8px 14px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
  }

  .table-container {
    overflow-x: auto;
  }

  table {
    width: 100%;
    min-width: 1100px;
    border-collapse: collapse;
  }

  th, td {
    padding: 8px;
    text-align: center;
    white-space: nowrap;
  }

  thead th {
    background-color: #1e293b;  /* header color */
    color: #f8fafc;             /* header text */
    font-weight: 600;
  }
  thead th:first-child {
    border-top-left-radius: 8px;
  }
  
  thead th:last-child {
    border-top-right-radius: 8px;
  }


  .GREEN { color: var(--green); font-weight: bold; }
  .RED { color: var(--red); font-weight: bold; }
  .AMBER { color: var(--amber); font-weight: bold; }
  .PINK { color: var(--pink); font-weight: bold; }
  .MARKET_CLOSED { color: #94a3b8; }
</style>
</head>

<body>

<h1>📈 Stock Live Monitor</h1>

  <!-- 🔹 ADD STOCK (RESTORED) -->
<div class="add-stock-container">
  <input type="text" placeholder="ICICIBANK.NS" />
  <button class="add-btn">Add Stock</button>
</div>
  
<div class="card">
  <div class="table-container">
    <table id="stockTable">
      <thead>
        <tr>
          <th>Symbol</th>
          <th>Last Price</th>
          <th>Current High</th>
          <th>Current Low</th>
          <th>10:30 High</th>
          <th>10:30 Low</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="7">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const API = "https://stock-analysis-module.onrender.com";

async function loadStocks() {
  try {
    const res = await fetch(`${API}/stocks`);
    const data = await res.json();

    const tbody = document.querySelector("#stockTable tbody");
    tbody.innerHTML = "";

    data.forEach(s => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${s.symbol}</td>
        <td>${s.last_price ?? "-"}</td>
        <td>${s.current_high ?? "-"}</td>
        <td>${s.current_low ?? "-"}</td>
        <td>${s.high_1030 ?? "-"}</td>
        <td>${s.low_1030 ?? "-"}</td>
        <td class="${s.status}">${s.status}</td>
      `;
      tbody.appendChild(tr);
    });

  } catch (e) {
    console.error(e);
  }
}

async function addStock() {
  const input = document.getElementById("symbolInput");
  let symbol = input.value.trim();
  if (!symbol) return;

  await fetch(`${API}/add/${symbol}`, { method: "POST" });
  input.value = "";
  loadStocks();
}

loadStocks();
setInterval(loadStocks, 3000); // 🔥 3 seconds refresh
</script>

</body>
</html>
