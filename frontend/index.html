<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stock Live Monitor</title>

<style>
  :root {
    --bg: #fff1e6;
    --green: #22c55e;
    --red: #ef4444;
    --amber: #f59e0b;
    --pink: #ec4899;
  }

  body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: var(--bg);
  }

  h1 {
    text-align: center;
    margin-bottom: 15px;
  }

  /* ✅ CENTERED – SAME SIZE */
  .add-stock-container {
    display: flex;              /* 🔑 REQUIRED */
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin: 20px auto;
  }

  .add-stock-container input {
    width: 160px;               /* SAME size */
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid #ddd;
    font-size: 14px;
    text-align: center;         /* 🔑 fixed */
  }

  .add-btn {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    background-color: #6c63ff;
    color: white;
    font-size: 14px;
    cursor: pointer;
  }

  .add-btn:hover {
    background-color: #5a52d6;
  }

  .table-container {
    overflow-x: auto;
  }

  table {
    width: 100%;
    min-width: 1100px;
    border-collapse: collapse;
    border: 1px solid #e5e7eb;   /* 🔹 outer outline */
    border-radius: 10px;
    overflow: hidden;
  }


  th, td {
    padding: 8px;
    text-align: center;
    white-space: nowrap;
  }
  
  /* 🔹 light separators only between rows */
  tbody tr {
    border-bottom: 1px solid rgba(0, 0, 0, 0.06);
  }
  
  /* 🔹 remove last line */
  tbody tr:last-child {
    border-bottom: none;
  }


  thead th {
    background-color: #1e293b;
    color: #f8fafc;
    font-weight: 600;
  }

  .GREEN { color: var(--green); font-weight: bold; }
  .RED { color: var(--red); font-weight: bold; }
  .AMBER { color: var(--amber); font-weight: bold; }
  .PINK { color: var(--pink); font-weight: bold; }
  .MARKET_CLOSED { color: #94a3b8; }
</style>
</head>

<body>

<h1>📈 Stock Live Monitor</h1>

<!-- ✅ CENTERED INPUT -->
<div class="add-stock-container">
  <input id="symbolInput" type="text" placeholder="ICICIBANK.NS" />
  <button class="add-btn" onclick="addStock()">Add Stock</button>
</div>

<div class="table-container">
  <table id="stockTable">
    <thead>
      <tr>
        <th>Symbol</th>
        <th>Last Price</th>
        <th>Current High</th>
        <th>Current Low</th>
        <th>10:30 High</th>
        <th>10:30 Low</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr><td colspan="7">Loading...</td></tr>
    </tbody>
  </table>
</div>

<script>
const API = "https://stock-analysis-module.onrender.com";

async function loadStocks() {
  const res = await fetch(`${API}/stocks`);
  const data = await res.json();

  const tbody = document.querySelector("#stockTable tbody");
  tbody.innerHTML = "";

  data.forEach(s => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${s.symbol}</td>
      <td>${s.last_price ?? "-"}</td>
      <td>${s.current_high ?? "-"}</td>
      <td>${s.current_low ?? "-"}</td>
      <td>${s.high_1030 ?? "-"}</td>
      <td>${s.low_1030 ?? "-"}</td>
      <td class="${s.status}">${s.status}</td>
    `;
    tbody.appendChild(tr);
  });
}

async function addStock() {
  const input = document.getElementById("symbolInput");
  const symbol = input.value.trim();
  if (!symbol) return;

  await fetch(`${API}/add/${symbol}`, { method: "POST" });
  input.value = "";
  loadStocks();
}

loadStocks();
setInterval(loadStocks, 3000);
</script>

</body>
</html>
