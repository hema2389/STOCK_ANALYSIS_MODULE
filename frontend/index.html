<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stock Live Monitor</title>

<style>
  :root {
    --bg: #fff1e6;
    --card: #0f172a;
    --green: #22c55e;
    --red: #ef4444;
    --amber: #f59e0b;
    --pink: #ec4899;
    --text: #e5e7eb;
  }

  body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: var(--bg);
  }

  h1 {
    text-align: center;
    margin-bottom: 15px;
  }

  .card {
    background: var(--card);
    padding: 16px;
    border-radius: 12px;
  }

  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }

  input {
    flex: 1;
    padding: 8px;
    border-radius: 6px;
    border: none;
  }

  button {
    padding: 8px 14px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
  }

  .table-container {
    overflow-x: auto;
  }

  table {
    width: 100%;
    min-width: 1100px;
    border-collapse: collapse;
    color: var(--text);
  }

  th, td {
    padding: 8px;
    text-align: center;
    border-bottom: 1px solid #334155;
    white-space: nowrap;
  }

  th {
    background: #020617;
    position: sticky;
    top: 0;
  }

  .GREEN { color: var(--green); font-weight: bold; }
  .RED { color: var(--red); font-weight: bold; }
  .AMBER { color: var(--amber); font-weight: bold; }
  .PINK { color: var(--pink); font-weight: bold; }
  .MARKET_CLOSED { color: #94a3b8; }
</style>
</head>

<body>

<h1>📈 Stock Live Monitor</h1>

<div class="card">

  <!-- 🔹 ADD STOCK (RESTORED) -->
  <div class="controls">
    <input id="symbolInput" placeholder="Add stock (e.g. ITC or ITC.NS)" />
    <button onclick="addStock()">Add</button>
  </div>

  <div class="table-container">
    <table id="stockTable">
      <thead>
        <tr>
          <th>Symbol</th>
          <th>Last Price</th>
          <th>Current High</th>
          <th>Current Low</th>
          <th>10:30 High</th>
          <th>10:30 Low</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="7">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const API = "https://stock-analysis-module.onrender.com";

async function loadStocks() {
  try {
    const res = await fetch(`${API}/stocks`);
    const data = await res.json();

    const tbody = document.querySelector("#stockTable tbody");
    tbody.innerHTML = "";

    data.forEach(s => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${s.symbol}</td>
        <td>${s.last_price ?? "-"}</td>
        <td>${s.current_high ?? "-"}</td>
        <td>${s.current_low ?? "-"}</td>
        <td>${s.high_1030 ?? "-"}</td>
        <td>${s.low_1030 ?? "-"}</td>
        <td class="${s.status}">${s.status}</td>
      `;
      tbody.appendChild(tr);
    });

  } catch (e) {
    console.error(e);
  }
}

async function addStock() {
  const input = document.getElementById("symbolInput");
  let symbol = input.value.trim();
  if (!symbol) return;

  await fetch(`${API}/add/${symbol}`, { method: "POST" });
  input.value = "";
  loadStocks();
}

loadStocks();
setInterval(loadStocks, 3000); // 🔥 3 seconds refresh
</script>

</body>
</html>
